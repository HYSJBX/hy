/* ==================== 视图 ==================== */
const app = document.getElementById('app');
const toastEl = document.getElementById('toast');

function listView() {
  return `
    <div class="wrap">
      <header class="site-header">
        <h1>小初高学习资料列表</h1>
        <p class="sub">共 ${data.length} 条资源 · 点击标题查看详情</p>
      </header>
      <ul class="list">
        ${data.map((item, i) => `
          <li>
            <a class="item" href="#/item/${item.id}">
              <span class="idx">${String(i + 1).padStart(2, '0')}</span>
              <span class="item-title">${item.title}</span>
              <span class="chev">›</span>
            </a>
          </li>`).join('')}
      </ul>
      <footer class="site-footer">— 已经到底啦 —</footer>
    </div>`;
}

function detailView(item) {
  return `
    <div class="wrap">
      <a class="back" href="#/">← 返回列表</a>
      <article class="card">
        <h1 class="detail-title">${item.title}</h1>
        <div class="divider"></div>
        <p class="detail-desc">${item.desc}</p>
        <a class="download-btn" href="${item.downloadUrl}"
           ${item.downloadUrl && item.downloadUrl !== '#' ? 'target="_blank" rel="noopener"' : ''}>下载资源</a>
        <p class="hint">点击下载资源下载源文件</p>
      </article>
    </div>`;
}

/* ==================== 路由 ==================== */
function route() {
  const hash = location.hash || '#/';
  const match = hash.match(/^#\/item\/(\d+)$/);

  if (match) {
    const item = data.find(d => d.id === Number(match[1]));
    if (item) {
      app.innerHTML = detailView(item);
      document.title = item.title;
    } else {
      location.hash = '#/';
      return;
    }
  } else {
    app.innerHTML = listView();
    document.title = '小初高学习资料列表';
  }
  window.scrollTo(0, 0);
}

window.addEventListener('hashchange', route);
route();

/* ==================== 下载按钮点击处理 ====================
   链接为 '#' 时拦截并提示；替换成真实链接后正常跳转。 */
let toastTimer = null;
function showToast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), 1600);
}

document.addEventListener('click', e => {
  const btn = e.target.closest('.download-btn');
  if (!btn) return;

  const href = btn.getAttribute('href');
  if (!href || href === '#') {
    e.preventDefault();
    showToast('下载链接为占位符，暂不可用');
  }
});
</script>
