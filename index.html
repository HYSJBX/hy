<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#12040A">
<title>心之所向 · 玫瑰相框</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:#0B0206;min-height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    color:#F5E6EA;
    display:flex;flex-direction:column;align-items:center;
    padding:16px 16px calc(26px + env(safe-area-inset-bottom));
    min-height:100vh;min-height:100dvh;
    -webkit-font-smoothing:antialiased;
  }
  .stage-wrap{
    width:100%;max-width:430px;
    border-radius:26px;overflow:hidden;
    position:relative;background:#1A050C;
    box-shadow:0 30px 70px -26px rgba(210,40,90,.55),
               0 0 0 1px rgba(255,255,255,.06);
    animation:fadeUp .6s ease both;
  }
  canvas{display:block;width:100%;height:auto;cursor:pointer}

  .controls{
    width:100%;max-width:430px;margin-top:18px;
    display:flex;flex-direction:column;gap:12px;
    animation:fadeUp .6s .08s ease both;
  }
  input.msg{
    width:100%;padding:15px 18px;border-radius:16px;
    border:1px solid rgba(255,255,255,.1);
    background:rgba(255,255,255,.06);color:#fff;
    font-size:15px;font-family:inherit;outline:none;
    transition:border-color .25s,background .25s;
  }
  input.msg::placeholder{color:rgba(255,255,255,.3)}
  input.msg:focus{border-color:rgba(255,120,160,.55);background:rgba(255,255,255,.09)}

  .row{display:flex;gap:12px}
  .btn{
    flex:1;border:none;border-radius:16px;padding:16px 14px;
    font-size:16px;font-weight:600;font-family:inherit;cursor:pointer;
    transition:transform .15s ease,opacity .2s ease;
  }
  .btn:active{transform:scale(.97)}
  .btn.primary{
    background:linear-gradient(135deg,#FF6B8E,#C92E5C);
    color:#fff;box-shadow:0 12px 26px -12px #E23B63;
  }
  .btn.ghost{background:rgba(255,255,255,.09);color:#FFD9E3}

  .tip{
    color:rgba(255,255,255,.3);font-size:12.5px;
    text-align:center;margin:16px 0 0;letter-spacing:.3px;
  }

  /* 弹层 */
  .overlay{
    position:fixed;inset:0;z-index:99;
    background:rgba(8,2,5,.88);
    -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
    display:flex;align-items:center;justify-content:center;
    padding:22px;
    opacity:0;pointer-events:none;transition:opacity .3s ease;
  }
  .overlay.show{opacity:1;pointer-events:auto}
  .sheet{
    width:100%;max-width:340px;max-height:100%;
    overflow-y:auto;-webkit-overflow-scrolling:touch;
    animation:fadeUp .4s ease both;
  }
  .sheet img{
    width:100%;display:block;border-radius:20px;
    box-shadow:0 30px 60px rgba(0,0,0,.65);
  }
  .sheet .hint{
    color:rgba(255,255,255,.65);font-size:13px;
    text-align:center;margin:14px 0 16px;letter-spacing:.3px;
  }

  @keyframes fadeUp{
    from{opacity:0;transform:translateY(14px)}
    to{opacity:1;transform:translateY(0)}
  }
</style>
</head>
<body>

<div class="stage-wrap">
  <canvas id="stage"></canvas>
</div>

<div class="controls">
  <input id="msgInput" class="msg" type="text" maxlength="16"
         placeholder="写一句话（可选，会印在卡片上）">
  <div class="row">
    <button class="btn ghost" id="pickBtn">添加照片</button>
    <button class="btn primary" id="genBtn">生成图片</button>
  </div>
</div>
<p class="tip">点击画面中央也能上传照片</p>

<input type="file" id="fileInput" accept="image/*" hidden>

<div class="overlay" id="overlay">
  <div class="sheet">
    <img id="cardImg" alt="玫瑰相框">
    <p class="hint">长按图片即可保存到相册</p>
    <div class="row">
      <button class="btn primary" id="saveBtn">保存图片</button>
      <button class="btn ghost" id="closeBtn">返回</button>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';

  /* ================= 基础常量 ================= */
  var W = 1080, H = 1440;
  var CX = 540, CY = 700;
  var R_HOLE = 195;          // 中心照片圆半径
  var FONT = '"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif';

  var stage = document.getElementById('stage');
  stage.width = W;
  stage.height = H;
  var ctx = stage.getContext('2d');

  var photoImg = null;       // 用户上传的图片
  var message = '';          // 底部留言
  var dataUrl = null;        // 生成的图片

  /* ================= 心形路径（参数方程） ================= */
  function heartPath(c, size) {
    c.beginPath();
    var s = size / 32;
    for (var i = 0; i <= 48; i++) {
      var t = i / 48 * Math.PI * 2;
      var px = 16 * Math.pow(Math.sin(t), 3);
      var py = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
      var X = px * s, Y = py * s;
      if (i === 0) c.moveTo(X, Y); else c.lineTo(X, Y);
    }
    c.closePath();
  }

  /* ================= 静态层：背景 ================= */
  var bgLayer = document.createElement('canvas');
  bgLayer.width = W; bgLayer.height = H;
  (function buildBg() {
    var c = bgLayer.getContext('2d');

    var g = c.createRadialGradient(CX, CY, 40, CX, CY, W * 0.92);
    g.addColorStop(0, '#4A0F1E');
    g.addColorStop(0.42, '#2A0710');
    g.addColorStop(1, '#0B0206');
    c.fillStyle = g;
    c.fillRect(0, 0, W, H);

    // 四角暗角
    var v = c.createRadialGradient(CX, CY, H * 0.32, CX, CY, H * 0.86);
    v.addColorStop(0, 'rgba(0,0,0,0)');
    v.addColorStop(1, 'rgba(0,0,0,0.65)');
    c.fillStyle = v;
    c.fillRect(0, 0, W, H);
  })();

  /* ================= 静态层：玫瑰 ================= */
  var roseLayer = document.createElement('canvas');
  roseLayer.width = W; roseLayer.height = H;

  function drawPetalRing(c, r0, r1, count, halfW, rot, colA, colB) {
    var len = r1 - r0;
    for (var i = 0; i < count; i++) {
      c.save();
      c.rotate(rot + i * Math.PI * 2 / count);

      c.beginPath();
      c.moveTo(0, -r0);
      c.bezierCurveTo(halfW, -r0 - len * 0.28,
                      halfW * 0.86, -r0 - len * 0.84, 0, -r1);
      c.bezierCurveTo(-halfW * 0.86, -r0 - len * 0.84,
                      -halfW, -r0 - len * 0.28, 0, -r0);
      c.closePath();

      var g = c.createLinearGradient(0, -r0, 0, -r1);
      g.addColorStop(0, colA);
      g.addColorStop(1, colB);
      c.fillStyle = g;
      c.fill();

      c.lineWidth = 2;
      c.strokeStyle = 'rgba(255,255,255,0.09)';
      c.stroke();

      c.restore();
    }
  }

  (function buildRose() {
    var c = roseLayer.getContext('2d');
    c.save();
    c.translate(CX, CY);

    // 外圈柔光
    var glow = c.createRadialGradient(0, 0, R_HOLE * 0.8, 0, 0, 470);
    glow.addColorStop(0, 'rgba(255,90,130,0)');
    glow.addColorStop(0.52, 'rgba(255,90,130,0.16)');
    glow.addColorStop(1, 'rgba(255,90,130,0)');
    c.fillStyle = glow;
    c.beginPath();
    c.arc(0, 0, 470, 0, Math.PI * 2);
    c.fill();

    // 由外向内五层花瓣
    drawPetalRing(c, 216, 420, 11, 100, 0.00, '#C22A55', '#7E1233');
    drawPetalRing(c, 212, 378,  9,  86, 0.35, '#D63A66', '#A81F47');
    drawPetalRing(c, 208, 330,  8,  68, 0.12, '#EC4E7C', '#C92E5C');
    drawPetalRing(c, 204, 286,  6,  52, 0.52, '#FF8FB0', '#EE5C88');
    drawPetalRing(c, 200, 250,  5,  36, 0.22, '#FFB3C6', '#FF7FA8');

    c.restore();
  })();

  /* ================= 闪烁的心形 ================= */
  var hearts = [];
  (function buildHearts() {
    var seed = 20240521;
    function rnd() {
      seed = (seed * 9301 + 49297) % 233280;
      return seed / 233280;
    }
    for (var i = 0; i < 24; i++) {
      var ang = rnd() * Math.PI * 2;
      var rad = 430 + rnd() * 190;
      hearts.push({
        x: CX + Math.cos(ang) * rad,
        y: CY + Math.sin(ang) * rad * 0.92,
        size: 16 + rnd() * 30,
        phase: rnd() * Math.PI * 2,
        speed: 0.7 + rnd() * 1.25,
        rot: (rnd() - 0.5) * 0.5
      });
    }
  })();

  function drawFloatingHearts(c, time) {
    for (var i = 0; i < hearts.length; i++) {
      var h = hearts[i];
      var p = Math.sin(time * h.speed + h.phase);
      var pulse = 0.5 + 0.5 * p;

      c.save();
      c.globalAlpha = 0.06 + 0.46 * pulse;
      c.translate(h.x, h.y);
      c.rotate(h.rot + Math.sin(time * 0.6 + h.phase) * 0.14);

      var size = h.size * (0.82 + 0.34 * pulse);
      heartPath(c, size);

      var g = c.createRadialGradient(0, -size * 0.22, 1, 0, 0, size * 0.95);
      g.addColorStop(0, 'rgba(255,228,238,0.96)');
      g.addColorStop(1, 'rgba(255,108,150,0.45)');
      c.fillStyle = g;
      c.fill();

      c.restore();
    }
  }

  /* ================= 中心照片 ================= */
  function drawPhoto(c) {
    // 柔和光晕
    c.save();
    var gl = c.createRadialGradient(CX, CY, R_HOLE * 0.92, CX, CY, R_HOLE * 1.7);
    gl.addColorStop(0, 'rgba(255,110,150,0.32)');
    gl.addColorStop(1, 'rgba(255,110,150,0)');
    c.fillStyle = gl;
    c.beginPath();
    c.arc(CX, CY, R_HOLE * 1.7, 0, Math.PI * 2);
    c.fill();
    c.restore();

    // 圆形内容
    c.save();
    c.beginPath();
    c.arc(CX, CY, R_HOLE, 0, Math.PI * 2);
    c.clip();

    if (photoImg && photoImg.width) {
      var scale = Math.max(R_HOLE * 2 / photoImg.width, R_HOLE * 2 / photoImg.height);
      var dw = photoImg.width * scale;
      var dh = photoImg.height * scale;
      c.drawImage(photoImg, CX - dw / 2, CY - dh / 2, dw, dh);
    } else {
      var g = c.createLinearGradient(CX, CY - R_HOLE, CX, CY + R_HOLE);
      g.addColorStop(0, '#3B0F1D');
      g.addColorStop(1, '#22070F');
      c.fillStyle = g;
      c.fillRect(CX - R_HOLE, CY - R_HOLE, R_HOLE * 2, R_HOLE * 2);

      // 加号
      c.strokeStyle = 'rgba(255,180,200,0.55)';
      c.lineWidth = 4;
      c.lineCap = 'round';
      c.beginPath();
      c.moveTo(CX - 26, CY - 42);
      c.lineTo(CX + 26, CY - 42);
      c.moveTo(CX, CY - 68);
      c.lineTo(CX, CY - 16);
      c.stroke();

      c.fillStyle = 'rgba(255,195,215,0.78)';
      c.font = '500 28px ' + FONT;
      c.textAlign = 'center';
      c.textBaseline = 'middle';
      c.fillText('点击添加照片', CX, CY + 44);
    }
    c.restore();

    // 双圆环
    c.beginPath();
    c.arc(CX, CY, R_HOLE, 0, Math.PI * 2);
    c.lineWidth = 4;
    c.strokeStyle = 'rgba(255,238,244,0.92)';
    c.stroke();

    c.beginPath();
    c.arc(CX, CY, R_HOLE + 13, 0, Math.PI * 2);
    c.lineWidth = 1.5;
    c.strokeStyle = 'rgba(255,190,212,0.34)';
    c.stroke();
  }

  /* ================= 文字 ================= */
  function drawTexts(c) {
    c.textAlign = 'center';
    c.textBaseline = 'alphabetic';

    // 顶部
    c.fillStyle = 'rgba(255,200,216,0.55)';
    c.font = '500 26px ' + FONT;
    c.fillText('F O R   Y O U', CX, 178);

    // 装饰线 + 小心
    c.strokeStyle = 'rgba(255,150,180,0.32)';
    c.lineWidth = 1.5;
    c.beginPath();
    c.moveTo(CX - 96, 1202);
    c.lineTo(CX - 30, 1202);
    c.moveTo(CX + 30, 1202);
    c.lineTo(CX + 96, 1202);
    c.stroke();

    c.save();
    c.translate(CX, 1192);
    heartPath(c, 24);
    c.fillStyle = 'rgba(255,120,160,0.9)';
    c.fill();
    c.restore();

    // 留言
    if (message) {
      c.fillStyle = 'rgba(255,238,244,0.96)';
      c.font = '500 36px ' + FONT;
      c.fillText(message, CX, 1278);
    }

    // 落款
    c.fillStyle = 'rgba(255,190,212,0.42)';
    c.font = '400 22px ' + FONT;
    c.fillText('· 心之所向 ·', CX, 1338);
  }

  /* ================= 整帧渲染 ================= */
  function renderScene(c, time) {
    c.clearRect(0, 0, W, H);
    c.drawImage(bgLayer, 0, 0);
    drawFloatingHearts(c, time);
    c.drawImage(roseLayer, 0, 0);
    drawPhoto(c);
    drawTexts(c);
  }

  /* ================= 动画循环（约 30fps 省电） ================= */
  var startTime = null, lastDraw = 0, clock = 0;

  function loop(now) {
    if (!startTime) startTime = now;
    clock = (now - startTime) / 1000;
    if (now - lastDraw > 33) {
      lastDraw = now;
      renderScene(ctx, clock);
    }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  /* ================= 上传照片 ================= */
  var fileInput = document.getElementById('fileInput');

  function openPicker() { fileInput.click(); }

  fileInput.addEventListener('change', function (e) {
    var file = e.target.files && e.target.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function (ev) {
      var im = new Image();
      im.onload = function () {
        photoImg = im;
        renderScene(ctx, clock);   // 立即刷一帧
      };
      im.onerror = function () { alert('这张图片读不出来，换一张试试～'); };
      im.src = ev.target.result;
    };
    reader.readAsDataURL(file);
    fileInput.value = '';
  });

  /* ================= 生成 / 保存 / 分享 ================= */
  var overlay = document.getElementById('overlay');
  var cardImg = document.getElementById('cardImg');
  var saveBtn = document.getElementById('saveBtn');

  function generate() {
    renderScene(ctx, clock);              // 确保当前帧完整
    dataUrl = stage.toDataURL('image/png');
    cardImg.src = dataUrl;
    overlay.classList.add('show');
  }

  function saveImage() {
    if (!dataUrl) return;
    var a = document.createElement('a');
    a.href = dataUrl;
    a.download = '心之所向-玫瑰相框.png';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  }

  function shareImage() {
    if (!dataUrl) return;
    fetch(dataUrl).then(function (res) {
      return res.blob();
    }).then(function (blob) {
      var file = new File([blob], 'rose-card.png', { type: 'image/png' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        navigator.share({
          files: [file],
          title: '心之所向',
          text: '送你一朵会闪的玫瑰 🌹'
        }).catch(function () {});
      } else {
        saveImage();
      }
    }).catch(function () { saveImage(); });
  }

  /* ================= 事件绑定 ================= */
  var msgInput = document.getElementById('msgInput');

  msgInput.addEventListener('input', function () {
    message = msgInput.value.trim();
    renderScene(ctx, clock);
  });

  document.getElementById('pickBtn').addEventListener('click', openPicker);
  document.getElementById('genBtn').addEventListener('click', generate);
  document.getElementById('closeBtn').addEventListener('click', function () {
    overlay.classList.remove('show');
  });
  overlay.addEventListener('click', function (e) {
    if (e.target === overlay) overlay.classList.remove('show');
  });

  // 点击画面上传照片（点在中心圆附近才触发，避免误触）
  stage.addEventListener('click', function (e) {
    var rect = stage.getBoundingClientRect();
    var x = (e.clientX - rect.left) / rect.width * W;
    var y = (e.clientY - rect.top) / rect.height * H;
    var d = Math.sqrt((x - CX) * (x - CX) + (y - CY) * (y - CY));
    if (d < R_HOLE + 60) openPicker();
  });

  // 支持文件分享时，把「保存」换成「分享」
  (function () {
    try {
      if (navigator.canShare) {
        var test = new File(['x'], 't.png', { type: 'image/png' });
        if (navigator.canShare({ files: [test] })) {
          saveBtn.textContent = '分享给朋友';
          saveBtn.addEventListener('click', shareImage);
          return;
        }
      }
    } catch (e) {}
    saveBtn.addEventListener('click', saveImage);
  })();

})();
</script>
</body>
</html>
