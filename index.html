  body{

  /* ===================== 顶部导航 ===================== */

  .logo{display:flex;align-items:center;gap:10px;flex-shrink:0;}
  .logo-mark{

  .logo-name{font-size:1.05rem;font-weight:700;letter-spacing:.01em;}
  .logo-name em{

    font-weight:800;letter-spacing:-.02em;line-height:1.25;

  .hero h1 .grad{

  }
  .hero p{
    margin:0;color:var(--ink-2);font-size:.98rem;

  }

  .toolbar{

    margin:30px 0 22px;

  .chips{display:flex;flex-wrap:wrap;gap:8px;}
  .chip{

    background:#fff;border:1px solid var(--line);
    font-size:.86rem;color:var(--ink-2);

  .chip.active{background:var(--ink);border-color:var(--ink);color:#fff;}

  .result-count{font-size:.84rem;color:var(--muted);}
  .result-count b{color:var(--ink);font-weight:600;}

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
    gap:22px;
    padding-bottom:20px;
  }

  .card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    overflow:hidden;
    cursor:pointer;
    transition:transform .38s cubic-bezier(.2,.8,.3,1),box-shadow .38s,border-color .38s;
  }
  .card:hover{
    transform:translateY(-5px);
    box-shadow:var(--shadow-lg);
    border-color:transparent;
  }

  .card-thumb{
    position:relative;aspect-ratio:4/3;overflow:hidden;
    background:linear-gradient(135deg,#eef0f5,#dfe3ec);
  }
  .card-thumb img{
    width:100%;height:100%;object-fit:cover;
    transition:transform .65s cubic-bezier(.2,.8,.3,1);
  }
  .card:hover .card-thumb img{transform:scale(1.06);}

  .card-thumb::after{
    content:"";position:absolute;inset:0;
    background:linear-gradient(to top,rgba(17,19,26,.55),transparent 58%);
    opacity:0;transition:opacity .35s ease;
  }

  .card-view{
    position:absolute;left:14px;bottom:12px;z-index:2;
    color:#fff;font-size:.79rem;letter-spacing:.06em;
    opacity:0;transform:translateY(8px);
    transition:opacity .35s ease,transform .35s ease;
  }
  .card-view::after{content:" →";}
  .card:hover .card-view{opacity:1;transform:none;}

    font-size:.95rem;font-weight:600;line-height:1.45;
  }
  .card-body p{margin:0;font-size:.77rem;color:var(--muted);}

  .toast{

  @media (max-width:980px){

    .card-body h3{font-size:.85rem;}
    .card-body p{font-size:.72rem;}

  }
  @media (max-width:420px){

    title: '笔记本电脑样机',
    cat: 'mockup',
    desc: '6 个笔记本与桌面设备样机，含 4K 分辨率输出，适合展示网页设计与软件界面。',
    tags: ['样机', '笔记本', '桌面', 'PSD'],
    format: 'PSD',
    size: '210 MB',
    count: '6 个场景',
    thumb: 'https://picsum.photos/id/1050/600/450',
    full:  'https://picsum.photos/id/1050/1400/1050',
    download: ''
  },
  {
    id: 12,
    title: '节日场景插画合集',
    cat: 'illustration',
    desc: '围绕春节、中秋与圣诞等节日创作的 20 幅场景插画，可用于活动页与节日海报。',
    tags: ['插画', '节日', '场景', '海报'],
    format: 'AI / PNG',
    size: '27.1 MB',
    count: '20 幅',
    thumb: 'https://picsum.photos/id/1052/600/450',
    full:  'https://picsum.photos/id/1052/1400/1050',
    download: ''
  }
];

/* =========================================================
   2. 分类配置
   ========================================================= */
const CATS = [
  { key: 'all',          name: '全部' },
  { key: 'ui',           name: 'UI 界面' },
  { key: 'illustration', name: '插画' },
  { key: 'icon',         name: '图标' },
  { key: 'background',   name: '背景' },
  { key: 'mockup',       name: '样机' }
];

const catName = key => (CATS.find(c => c.key === key) || {}).name || '素材';

/* =========================================================
   3. 元素引用与状态
   ========================================================= */
const homeView   = document.getElementById('homeView');
const detailView = document.getElementById('detailView');
const grid       = document.getElementById('grid');
const chipsEl    = document.getElementById('chips');
const emptyEl    = document.getElementById('empty');
const countNum   = document.getElementById('countNum');
const searchInput= document.getElementById('searchInput');
const toastEl    = document.getElementById('toast');
const resetBtn   = document.getElementById('resetBtn');

const state = { cat: 'all', q: '' };

/* =========================================================
   4. 卡片模板
   ========================================================= */
function cardHTML(item) {
  return `
    <article class="card" data-id="${item.id}">
      <div class="card-thumb">
        <span class="card-badge">${catName(item.cat)}</span>
        <img src="${item.thumb}" alt="${item.title}" loading="lazy">
        <span class="card-view">查看详情</span>
      </div>
      <div class="card-body">
        <h3>${item.title}</h3>
        <p>${item.count} · ${item.format}</p>
      </div>
    </article>`;
}

/* =========================================================
   5. 首页渲染
   ========================================================= */
function renderHome() {
  const q = state.q;
  const list = DATA.filter(item => {
    const okCat = state.cat === 'all' || item.cat === state.cat;
    const haystack = (item.title + item.desc + item.tags.join('')).toLowerCase();
    const okQ = !q || haystack.includes(q);
    return okCat && okQ;
  });

  grid.innerHTML = list.map(cardHTML).join('');
  countNum.textContent = list.length;
  emptyEl.hidden = list.length > 0;
}

/* =========================================================
   6. 详情页渲染
   ========================================================= */
function renderDetail(id) {
  const item = DATA.find(i => i.id === Number(id));
  if (!item) { location.hash = '#/'; return; }

  // 相关推荐：同分类优先，不足则用其他素材补齐
  let related = DATA.filter(i => i.cat === item.cat && i.id !== item.id);
  if (related.length < 4) {
    related = related.concat(
      DATA.filter(i => i.cat !== item.cat && i.id !== item.id)
    );
  }
  related = related.slice(0, 4);

  detailView.innerHTML = `
    <div class="container">
      <a class="back-link" href="#/">← 返回素材库</a>

      <div class="detail-layout">
        <div class="detail-media">
          <img src="${item.full}" alt="${item.title}">
        </div>

        <aside class="detail-side">
          <span class="detail-cat">${catName(item.cat)}</span>
          <h1>${item.title}</h1>
          <p class="detail-desc">${item.desc}</p>

          <ul class="meta-list">
            <li><span>文件格式</span><b>${item.format}</b></li>
            <li><span>文件大小</span><b>${item.size}</b></li>
            <li><span>素材数量</span><b>${item.count}</b></li>
            <li><span>授权方式</span><b>免费商用</b></li>
          </ul>

          <div class="detail-tags">
            ${item.tags.map(t => `<span>#${t}</span>`).join('')}
          </div>

          <!-- ★ 下载按钮：href 来自数据里的 download 字段，留空即代表暂未配置 -->
          <a class="btn-download" id="downloadBtn" href="${item.download}">
            <svg viewBox="0 0 24 24">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
              <path d="m7 10 5 5 5-5"/>
              <path d="M12 15V3"/>
            </svg>
            立即下载
          </a>
          <p class="download-hint">点击即可获取素材压缩包，无需注册</p>
        </aside>
      </div>

      <section class="related">
        <h2>相关推荐</h2>
        <div class="grid">
          ${related.map(cardHTML).join('')}
        </div>
      </section>
    </div>
  `;

  // 空链接拦截：如果 download 为空，阻止跳转并给出提示
  const btn = document.getElementById('downloadBtn');
  btn.addEventListener('click', e => {
    if (!item.download) {
      e.preventDefault();
      showToast('下载链接尚未配置，请在代码里填写 download 字段');
    }
  });
}

/* =========================================================
   7. 路由
   ========================================================= */
function route() {
  const hash = location.hash || '#/';
  const match = hash.match(/^#\/item\/(\d+)$/);

  if (match) {
    homeView.hidden = true;
    detailView.hidden = false;
    renderDetail(match[1]);
  } else {
    detailView.hidden = true;
    homeView.hidden = false;
    renderHome();
  }
  window.scrollTo(0, 0);
}

window.addEventListener('hashchange', route);

/* =========================================================
   8. 交互事件
   ========================================================= */

/* --- 分类标签 --- */
chipsEl.innerHTML = CATS
  .map(c => `<button class="chip${c.key === 'all' ? ' active' : ''}" data-cat="${c.key}">${c.name}</button>`)
  .join('');

chipsEl.addEventListener('click', e => {
  const btn = e.target.closest('.chip');
  if (!btn) return;

  chipsEl.querySelectorAll('.chip').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');

  state.cat = btn.dataset.cat;
  renderHome();
});

/* --- 搜索 --- */
searchInput.addEventListener('input', e => {
  state.q = e.target.value.trim().toLowerCase();

  // 如果在详情页，先回到首页
  if (location.hash.startsWith('#/item/')) {
    location.hash = '#/';
  } else {
    renderHome();
  }
});

/* --- 首页卡片点击 --- */
grid.addEventListener('click', e => {
  const card = e.target.closest('.card');
  if (card) location.hash = '#/item/' + card.dataset.id;
});

/* --- 详情页内的卡片点击（相关推荐） --- */
detailView.addEventListener('click', e => {
  const card = e.target.closest('.card');
  if (card) location.hash = '#/item/' + card.dataset.id;
});

/* --- 清除筛选 --- */
resetBtn.addEventListener('click', () => {
  state.cat = 'all';
  state.q = '';
  searchInput.value = '';
  chipsEl.querySelectorAll('.chip').forEach((b, i) => {
    b.classList.toggle('active', i === 0);
  });
  renderHome();
});

/* =========================================================
   9. 提示条
   ========================================================= */
let toastTimer;
function showToast(text) {
  toastEl.textContent = text;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), 3000);
}

/* =========================================================
   10. 启动
   ========================================================= */
route();
</script>
</body>
</html>
